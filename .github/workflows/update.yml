name: Refresh profile cards

on:
  schedule:
    - cron: "23 4 * * *"  # daily 04:23 UTC (07:23 Athens summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(cards): refresh $(date -u +%Y-%m-%d)"
          # main may have moved while we rendered; rebase onto it and retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

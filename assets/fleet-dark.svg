<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" role="img" aria-labelledby="title desc">
<title id="title">Fleet: public repositories</title>
<desc id="desc">Public repositories: digital-airlines-api (Flight booking REST API with Flask, MongoDB and Docker. University of Piraeus project, rebuilt with tests and CI.); gs1-inventory-scanner (Scan GS1 pallet and carton labels on any device, track where stock goes, and print GS1-128 labels. Open source and self-hosted.); devflow (Web app with authentication, database integration, security rules, testing, CI/CD and deployment); python-playground (Small Python programs I wrote while learning: networking, cryptography challenges, competitive programming and algorithm exercises.)</desc>

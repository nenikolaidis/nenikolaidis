<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img" aria-labelledby="title desc">
<title id="title">Captain&#x27;s log</title>
<desc id="desc">mission: Start with the problem, understand the system, build the solution, then improve it. on_watch: IT engineer: keeping systems, networks and people running. Troubleshooting hardware, software and infrastructure. off_watch: Side projects, a homelab to break and fix, and cloud certifications in progress. home_port: Greece. Named after an admiral who mapped unknown coastlines; I map unknown systems.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

.sweep { transform-origin: 100px 104px; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.blip { animation: pulse 4.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.boot { animation: boot 0.5s ease-out backwards; }
@keyframes boot { from { opacity: 0; transform: translateX(-6px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(20,60,100,0.06)"/>
</pattern>
</defs>
<rect x="0.5" y="0.5" width="879" height="411" rx="14" fill="#f3f6f9" stroke="rgba(20,60,100,0.16)"/>
<rect x="0.5" y="0.5" width="879" height="411" rx="14" fill="url(#grid)"/>
<g fill="#13212e">
<rect x="24.0" y="24.0" width="832.0" height="364.0" rx="8" fill="rgba(20,60,100,0.03)" stroke="rgba(20,60,100,0.16)"/><text x="38.0" y="46.0" font-size="11" font-weight="700" fill="#0f8a84" text-anchor="start" letter-spacing="1.5">[ CAPTAIN&#x27;S LOG ]</text><text x="183.7" y="46.0" font-size="11" font-weight="400" fill="#5d7184" text-anchor="start" >$ cat captain.log</text>
<line x1="38" y1="58" x2="842" y2="58" stroke="rgba(20,60,100,0.16)"/>
<g class="boot" style="animation-delay:0.2s"><text x="42.0" y="82.0" font-size="14" font-weight="400" fill="#5d7184" text-anchor="start" >&gt; </text><text x="60.0" y="82.0" font-size="14" font-weight="700" fill="#0f8a84" text-anchor="start" >mission</text>
<text x="68.0" y="104.0" font-size="13" font-weight="400" text-anchor="start" >Start with the problem, understand the system,</text>
<text x="68.0" y="125.0" font-size="13" font-weight="400" text-anchor="start" >build the solution, then improve it.</text>
</g>
<g class="boot" style="animation-delay:0.6s"><text x="42.0" y="164.0" font-size="14" font-weight="400" fill="#5d7184" text-anchor="start" >&gt; </text><text x="60.0" y="164.0" font-size="14" font-weight="700" fill="#b86e00" text-anchor="start" >on_watch</text>
<text x="68.0" y="186.0" font-size="13" font-weight="400" text-anchor="start" >IT engineer: keeping systems, networks and people running.</text>
<text x="68.0" y="207.0" font-size="13" font-weight="400" text-anchor="start" >Troubleshooting hardware, software and infrastructure.</text>
</g>
<g class="boot" style="animation-delay:1.0s"><text x="42.0" y="246.0" font-size="14" font-weight="400" fill="#5d7184" text-anchor="start" >&gt; </text><text x="60.0" y="246.0" font-size="14" font-weight="700" fill="#c62828" text-anchor="start" >off_watch</text>
<text x="68.0" y="268.0" font-size="13" font-weight="400" text-anchor="start" >Side projects, a homelab to break and fix,</text>
<text x="68.0" y="289.0" font-size="13" font-weight="400" text-anchor="start" >and cloud certifications in progress.</text>
</g>
<g class="boot" style="animation-delay:1.4s"><text x="42.0" y="328.0" font-size="14" font-weight="400" fill="#5d7184" text-anchor="start" >&gt; </text><text x="60.0" y="328.0" font-size="14" font-weight="700" fill="#1565c0" text-anchor="start" >home_port</text>
<text x="68.0" y="350.0" font-size="13" font-weight="400" text-anchor="start" >Greece. Named after an admiral who mapped</text>
<text x="68.0" y="371.0" font-size="13" font-weight="400" text-anchor="start" >unknown coastlines; I map unknown systems.</text>
</g>
</g>
</svg>
